plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
}

android {
    namespace "com.mojo.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.mojo.app"
        minSdk 26
        targetSdk 34
        // CI passes -PversionCode=<run_number>; local builds default to 1
        versionCode((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName "1.0.${versionCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing: CI restores the permanent keystore from GitHub Secrets
    // (see .github/workflows/build.yml). Passwords come from environment
    // variables and are never stored in the repo.
    // Local debug builds use Android's default debug key, so no keystore is needed.
    def releaseKeystore = file(System.getenv("MOJO_KEYSTORE_PATH") ?: "../mojo_release.jks")

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword System.getenv("MOJO_KEYSTORE_PASSWORD")
            keyAlias System.getenv("MOJO_KEY_ALIAS") ?: "mojo_key"
            keyPassword System.getenv("MOJO_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }
    buildFeatures {
        viewBinding true
        compose true
    }
    // Compose compiler 1.5.14 matches Kotlin 1.9.24
    composeOptions { kotlinCompilerExtensionVersion "1.5.14" }
    packaging {
        resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
    }
    androidResources { noCompress "mojo", "pcm" }
    lint { abortOnError false }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.activity:activity-ktx:1.8.2"

    // Jetpack Compose (UI + MOJO mascot)
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.5"
    implementation "androidx.room:room-runtime:2.6.0"
    implementation "androidx.room:room-ktx:2.6.0"
    kapt "androidx.room:room-compiler:2.6.0"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "com.google.android.gms:play-services-location:21.1.0"
    testImplementation "junit:junit:4.13.2"
}