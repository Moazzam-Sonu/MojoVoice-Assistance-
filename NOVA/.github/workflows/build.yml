name: Build and Release NOVA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-disabled: true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias nova_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore nova_release.jks \
            -storepass nova2024 \
            -keypass nova2024 \
            -dname "CN=NOVA App,OU=NOVA,O=Aniket,L=Surat,ST=Gujarat,C=IN" \
            -storetype PKCS12 2>/dev/null
          echo "Keystore: $(ls -lh nova_release.jks)"

      - name: Build signed release APK (clean)
        run: |
          gradle clean assembleRelease 2>&1 | tee /tmp/build.txt
          if grep -q "BUILD SUCCESSFUL" /tmp/build.txt; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
            {
              echo "=== Kotlin errors ==="
              grep "^e: " /tmp/build.txt || echo "none"
              echo ""
              echo "=== FAILED tasks ==="
              grep "FAILED\|Caused by:" /tmp/build.txt | head -10 || echo "none"
              echo ""
              echo "=== Last 40 lines ==="
              tail -40 /tmp/build.txt
            } > BUILD_ERRORS.txt
            git config user.email "ci@nova.app"
            git config user.name "NOVA CI"
            git add BUILD_ERRORS.txt
            git diff --cached --quiet || git commit -m "ci: build errors $(date +%s)"
            git push || true
            cat /tmp/build.txt | grep "^e: " | head -20
            exit 1
          fi

      - name: Copy APK
        if: env.BUILD_OK == 'true'
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" release/NOVA-v1.0.${{ github.run_number }}.apk
          echo "APK: $(ls -lh release/)"

      - name: Upload APK artifact
        if: env.BUILD_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: release/NOVA-*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: env.BUILD_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NOVA v1.0.${{ github.run_number }}"
          body: |
            ## NOVA Voice Controller

            100% offline AI voice controller for Android.
            No internet. No third-party AI SDKs. Built entirely from scratch.

            ### What is new
            - Settings screen now fully works
            - Wake word training screen works
            - **In-app updates** — tap Settings → Check for update → Download and install
            - Properly signed APK — installs on all Android phones (Motorola, Samsung, Xiaomi, etc.)

            ### Install
            1. Download NOVA-v1.0.${{ github.run_number }}.apk below
            2. Open on your Android phone
            3. Allow "Install unknown apps" if prompted
            4. Tap Install — works on every Android 8.0+ phone

            ### First time setup
            Open NOVA → grant permissions → enable Accessibility → Set Wake Word → record 20 samples → Train
          files: release/NOVA-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}