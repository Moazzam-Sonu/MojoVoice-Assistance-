name: Build and Release MOJO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MojoAi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias mojo_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore mojo_release.jks \
            -storepass mojo2024 \
            -keypass mojo2024 \
            -dname "CN=MOJO App,OU=MOJO,O=Mojo,C=PK" \
            -storetype PKCS12 2>/dev/null
          echo "Keystore: $(ls -lh mojo_release.jks)"

      - name: Build signed release APK (clean)
        run: |
          gradle clean assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee /tmp/build.txt
          if grep -q "BUILD SUCCESSFUL" /tmp/build.txt; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
            {
              echo "=== Kotlin errors ==="
              grep "^e: " /tmp/build.txt || echo "none"
              echo ""
              echo "=== FAILED tasks ==="
              grep "FAILED\|Caused by:" /tmp/build.txt | head -10 || echo "none"
              echo ""
              echo "=== Last 40 lines ==="
              tail -40 /tmp/build.txt
            } > BUILD_ERRORS.txt
            git config user.email "ci@mojo.app"
            git config user.name "MOJO CI"
            git add BUILD_ERRORS.txt
            git diff --cached --quiet || git commit -m "ci: build errors $(date +%s)"
            git push || true
            cat /tmp/build.txt | grep "^e: " | head -20
            exit 1
          fi

      - name: Copy APK
        if: env.BUILD_OK == 'true'
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" release/MOJO-v1.0.${{ github.run_number }}.apk
          echo "APK: $(ls -lh release/)"

      - name: Upload APK artifact
        if: env.BUILD_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOJO-APK
          path: MojoAi/release/MOJO-*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: env.BUILD_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MOJO v1.0.${{ github.run_number }}"
          body: |
            ## MOJO Voice Controller

            100% offline AI voice controller for Android.
            No internet. No third-party AI SDKs. Built entirely from scratch.

            ### What is new
            - Settings screen now fully works
            - Wake word training screen works
            - **In-app updates** — tap Settings → Check for update → Download and install
            - Properly signed APK — installs on all Android phones (Motorola, Samsung, Xiaomi, etc.)

            ### Install
            1. Download MOJO-v1.0.${{ github.run_number }}.apk below
            2. Open on your Android phone
            3. Allow "Install unknown apps" if prompted
            4. Tap Install — works on every Android 8.0+ phone

            ### First time setup
            Open MOJO → grant permissions → enable Accessibility → Set Wake Word → record 20 samples → Train
          files: MojoAi/release/MOJO-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}