name: Build and Release MOJO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MojoAi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # The SAME permanent key must sign every release, otherwise Android
      # refuses to install an update over the existing app.
      - name: Restore signing keystore from secrets
        env:
          MOJO_KEYSTORE_BASE64: ${{ secrets.MOJO_KEYSTORE_BASE64 }}
        # Without the secrets we still compile, but only as a debug "dev" pre-release
        # (pre-releases are ignored by the in-app updater).
        run: |
          if [ -z "$MOJO_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets missing - building a debug dev pre-release instead of a signed release."
            echo "HAS_KEY=false" >> $GITHUB_ENV
          else
            echo "$MOJO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mojo_release.jks"
            echo "Keystore restored: $(ls -lh $RUNNER_TEMP/mojo_release.jks)"
            echo "HAS_KEY=true" >> $GITHUB_ENV
          fi

      - name: Build signed release APK (clean)
        env:
          MOJO_KEYSTORE_PATH: ${{ runner.temp }}/mojo_release.jks
          MOJO_KEYSTORE_PASSWORD: ${{ secrets.MOJO_KEYSTORE_PASSWORD }}
          MOJO_KEY_ALIAS: ${{ secrets.MOJO_KEY_ALIAS }}
          MOJO_KEY_PASSWORD: ${{ secrets.MOJO_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle clean $TASK -PversionCode=${{ github.run_number }} 2>&1 | tee /tmp/build.txt
          if grep -q "BUILD SUCCESSFUL" /tmp/build.txt; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
            {
              echo "=== Kotlin errors ==="
              grep "^e: " /tmp/build.txt || echo "none"
              echo ""
              echo "=== FAILED tasks ==="
              grep "FAILED\|Caused by:" /tmp/build.txt | head -10 || echo "none"
              echo ""
              echo "=== Last 40 lines ==="
              tail -40 /tmp/build.txt
            } > BUILD_ERRORS.txt
            # This file is committed to the public repo, and log masking doesn't apply
            # to files — scrub the signing passwords just in case they ever appear.
            for s in "$MOJO_KEYSTORE_PASSWORD" "$MOJO_KEY_PASSWORD"; do
              if [ -n "$s" ]; then sed -i "s|$s|***|g" BUILD_ERRORS.txt; fi
            done
            git config user.email "ci@mojo.app"
            git config user.name "MOJO CI"
            git add BUILD_ERRORS.txt
            git diff --cached --quiet || git commit -m "ci: build errors $(date +%s)"
            git push || true
            cat /tmp/build.txt | grep "^e: " | head -20
            exit 1
          fi

      - name: Copy APK
        if: env.BUILD_OK == 'true'
        run: |
          mkdir -p release
          if [ "$HAS_KEY" = "true" ]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            cp "$APK" release/MOJO-v1.0.${{ github.run_number }}.apk
          else
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            cp "$APK" release/MOJO-dev-${{ github.run_number }}-debug.apk
          fi
          echo "APK: $(ls -lh release/)"

      - name: Upload APK artifact
        if: env.BUILD_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOJO-APK
          path: MojoAi/release/MOJO-*.apk
          retention-days: 90

      - name: Create dev pre-release (unsigned debug build)
        if: env.BUILD_OK == 'true' && env.HAS_KEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "MOJO dev build ${{ github.run_number }}"
          prerelease: true
          body: |
            Debug test build — not for normal use. Signed with a throwaway debug key,
            so uninstall any other MOJO build before installing this one.
          files: MojoAi/release/MOJO-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: env.BUILD_OK == 'true' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MOJO v1.0.${{ github.run_number }}"
          body: |
            ## MOJO Voice Controller

            100% offline AI voice controller for Android.
            No internet. No third-party AI SDKs. Built entirely from scratch.

            ### What is new
            - Settings screen now fully works
            - Wake word training screen works
            - **In-app updates** — tap Settings → Check for update → Download and install
            - Properly signed APK — installs on all Android phones (Motorola, Samsung, Xiaomi, etc.)

            ### Install
            1. Download MOJO-v1.0.${{ github.run_number }}.apk below
            2. Open on your Android phone
            3. Allow "Install unknown apps" if prompted
            4. Tap Install — works on every Android 8.0+ phone

            ### First time setup
            Open MOJO → grant permissions → enable Accessibility → Set Wake Word → record 3 samples → Train
          files: MojoAi/release/MOJO-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}